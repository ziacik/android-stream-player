name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, e.g. 0.1.0
        required: true
        default: '0.1.0'
      version_code:
        description: Monotonically increasing Android version code
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kino-release.jks"

      - name: Verify
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build signed universal release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KINO_KEYSTORE_FILE: ${{ runner.temp }}/kino-release.jks
          KINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KINO_VERSION_NAME: ${{ inputs.version_name }}
          KINO_VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew :app:assembleRelease -PtorrserverAbis=arm64-v8a,armeabi-v7a --stacktrace

      - name: Verify release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libtorrserver.so'
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libtorrserver.so'
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "kino-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kino-${{ inputs.version_name }}
          path: kino-${{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          tag="v${VERSION_NAME}"
          apk="kino-${VERSION_NAME}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --generate-notes --title "Kino ${VERSION_NAME}"
          fi
