name: Android CI

on:
  push:
    branches:
      - master
      - feature/foundation
      - feature/torrent-playback-proof
      - feature/movie-catalog-search
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TMDB_API_KEY: ci-placeholder

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify deploy script
        run: |
          test -x deploy-debug
          sh -n deploy-debug

      - name: Verify old libtorrent backend is gone
        run: |
          ! grep -R -E 'libtorrent4j|TorrentPieceAccess' app/src app/build.gradle.kts gradle/libs.versions.toml

      - name: Verify Media3 MKV fix version
        run: grep -q '^media3 = "1.11.0"$' gradle/libs.versions.toml

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Compile debug APK and instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleAndroidTest --stacktrace

      - name: Verify TorrServer executable packaging
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libtorrserver.so'

      - name: Verify clean 32-bit TorrServer ABI switch
        run: |
          ./gradlew :app:prepareTorrServerBinary -PtorrserverAbi=armeabi-v7a --stacktrace
          test -f app/build/generated/torrserver/jniLibs/armeabi-v7a/libtorrserver.so
          test ! -e app/build/generated/torrserver/jniLibs/arm64-v8a/libtorrserver.so

      - name: Verify signed universal release APK
        env:
          KINO_KEYSTORE_FILE: ${{ runner.temp }}/kino-ci-release.jks
          KINO_KEYSTORE_PASSWORD: android
          KINO_KEY_ALIAS: kino-ci
          KINO_KEY_PASSWORD: android
          KINO_VERSION_NAME: 0.1.0-ci
          KINO_VERSION_CODE: '1'
        run: |
          keytool -genkeypair \
            -keystore "$KINO_KEYSTORE_FILE" \
            -storepass "$KINO_KEYSTORE_PASSWORD" \
            -alias "$KINO_KEY_ALIAS" \
            -keypass "$KINO_KEY_PASSWORD" \
            -dname 'CN=Kino CI,O=Kino,C=SK' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1
          ./gradlew :app:assembleRelease -PtorrserverAbis=arm64-v8a,armeabi-v7a --stacktrace
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libtorrserver.so'
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libtorrserver.so'
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
