name: Android CI

on:
  push:
    branches:
      - master
      - feature/foundation
      - feature/torrent-playback-proof
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile debug APK and instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleAndroidTest --stacktrace

      - name: Verify TorrServer executable packaging
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libtorrserver.so'
