name: Android CI

on:
  push:
    branches:
      - master
      - feature/foundation
      - feature/torrent-playback-proof
      - feature/movie-catalog-search
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TMDB_API_KEY: ci-placeholder

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify deploy script
        run: |
          test -x deploy-debug
          sh -n deploy-debug

      - name: Verify old libtorrent backend is gone
        run: |
          ! grep -R -E 'libtorrent4j|TorrentPieceAccess' app/src app/build.gradle.kts gradle/libs.versions.toml

      - name: Verify Media3 MKV fix version
        run: grep -q '^media3 = "1.11.0"$' gradle/libs.versions.toml

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Compile debug APK and instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleAndroidTest --stacktrace

      - name: Verify TorrServer executable packaging
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libtorrserver.so'

      - name: Verify clean 32-bit TorrServer ABI switch
        run: |
          ./gradlew :app:prepareTorrServerBinary -PtorrserverAbi=armeabi-v7a --stacktrace
          test -f app/build/generated/torrserver/jniLibs/armeabi-v7a/libtorrserver.so
          test ! -e app/build/generated/torrserver/jniLibs/arm64-v8a/libtorrserver.so

      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

  focus-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run focus regression on TV emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=sk.ziacik.androidstreamplayer.ui.KinoAppTest#dpadCanMoveDownAgainAfterReturningFromScrolledTrendingRow --stacktrace
